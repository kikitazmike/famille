<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>Famille</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icone-192.png">
<link rel="apple-touch-icon" href="icons/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Applique le thème avant l'affichage pour éviter un flash
  try {
    var p = JSON.parse(localStorage.getItem('famille-prefs') || '{}');
    var t = p.theme === 'auto' || !p.theme ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'fonce' : 'clair') : p.theme;
    document.documentElement.dataset.theme = t;
    if (p.zoom) document.documentElement.style.setProperty('--zoom', p.zoom);
  } catch (e) {}
</script>
</head>
<body>
<div id="appli">
  <div id="contenu"><div class="accueil"><div class="logo" aria-hidden="true"></div><p class="c">Chargement…</p></div></div>
</div>
<div id="zone-fenetre"></div>
<div id="zone-toast" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
<noscript>Active JavaScript pour utiliser l'appli Famille.</noscript>
</body>
</html>
